<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
</head>
<body>
    <div class="app-container chat-page">
        <!-- Chat Header -->
        <header class="chat-header">
            <button id="backBtn" class="icon-btn">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="chat-partner-info">
                <div class="chat-partner-avatar" id="partnerAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <div>
                    <h2 id="partnerName">Loading...</h2>
                    <p id="partnerStatus" class="partner-status">Online</p>
                </div>
            </div>
            <div class="chat-actions">
                <button class="icon-btn" id="videoCallBtn">
                    <i class="fas fa-video"></i>
                </button>
                <button class="icon-btn" id="voiceCallBtn">
                    <i class="fas fa-phone"></i>
                </button>
                <button class="icon-btn" id="menuBtn">
                    <i class="fas fa-ellipsis-v"></i>
                </button>
            </div>
        </header>

        <!-- Messages Container -->
        <div class="messages-container" id="messagesContainer">
            <div class="messages" id="messages">
                <!-- Messages will be loaded here -->
                <div class="loading-messages">Loading messages...</div>
            </div>
        </div>

        <!-- Message Input -->
        <div class="message-input-container">
            <button class="icon-btn" id="attachBtn">
                <i class="fas fa-paperclip"></i>
            </button>
            <div class="message-input-wrapper">
                <input type="text" id="messageInput" placeholder="Type a message...">
                <div class="input-actions">
                    <button class="icon-btn" id="emojiBtn">
                        <i class="far fa-smile"></i>
                    </button>
                </div>
            </div>
            <button class="icon-btn send-btn" id="sendBtn">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>

        <!-- Attachment Menu -->
        <div class="attachment-menu" id="attachmentMenu">
            <button class="attachment-option" data-type="image">
                <i class="fas fa-image"></i>
                <span>Photo</span>
            </button>
            <button class="attachment-option" data-type="camera">
                <i class="fas fa-camera"></i>
                <span>Camera</span>
            </button>
            <button class="attachment-option" data-type="document">
                <i class="fas fa-file"></i>
                <span>Document</span>
            </button>
            <button class="attachment-option" data-type="location">
                <i class="fas fa-map-marker-alt"></i>
                <span>Location</span>
            </button>
        </div>

        <!-- File Input (hidden) -->
        <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx" style="display: none;">
    </div>

    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="chat-service.js"></script>
    <script src="chat.js"></script>
</body>
</html>
