<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>Messages</h1>
            <div class="header-actions">
                <button id="newGroupBtn" class="icon-btn" title="New Group">
                    <i class="fas fa-users"></i>
                </button>
                <button id="newChatBtn" class="icon-btn" title="New Chat">
                    <i class="fas fa-edit"></i>
                </button>
                <button id="logoutBtn" class="icon-btn" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search messages...">
        </div>

        <!-- Chat List -->
        <div class="chat-list" id="chatList">
            <!-- Chats will be loaded here -->
            <div class="loading">Loading chats...</div>
        </div>

        <!-- New Chat Modal -->
        <div id="newChatModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>New Chat</h3>
                    <span class="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <div class="user-search">
                        <input type="text" id="userSearch" placeholder="Search users...">
                        <div id="userList" class="user-list">
                            <!-- Users will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- New Group Modal -->
        <div id="newGroupModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Create New Group</h3>
                    <span class="close-modal">&times;</span>
                </div>
                <div class="modal-body">
                    <form id="groupForm">
                        <div class="form-group">
                            <label for="groupName">Group Name</label>
                            <input type="text" id="groupName" required>
                        </div>
                        <div class="form-group">
                            <label for="groupDescription">Description (Optional)</label>
                            <textarea id="groupDescription" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Add Members</label>
                            <div class="member-search">
                                <input type="text" id="memberSearch" placeholder="Search users to add...">
                                <div id="memberList" class="member-list">
                                    <!-- Users will be loaded here -->
                                </div>
                            </div>
                            <div id="selectedMembers" class="selected-members">
                                <!-- Selected members will appear here -->
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Create Group</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="chat-service.js"></script>
    <script src="chat-list.js"></script>
</body>
</html>
